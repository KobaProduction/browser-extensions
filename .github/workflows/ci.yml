name: Validate modules (Zoomies)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Explicit full-repository acceptance (default: affected changes only)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    # The self-hosted runner lost connectivity and stalled IndexedDB tests.
    # Validate all source changes on a fresh GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.4.2'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Read published version authority
        run: git fetch origin dev --tags --force
      - name: Check and build affected sources and consumers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.full == true }}
        run: bun run check
      - name: Enforce independent product version contracts
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/version-policy.ts
      - name: Upload requested build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modular-browser-bundles
          path: dist/**/*
          if-no-files-found: ignore
