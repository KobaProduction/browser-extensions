name: Validate modules (Zoomies)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    # The self-hosted runner lost connectivity and stalled IndexedDB tests.
    # Validate all source changes on a fresh GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.4.2'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck, test, validate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun run check
      - name: Enforce independent product version contracts
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/version-policy.ts
      - name: Build only impacted distribution modules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run build:changed
      - name: Check generated outputs when modules changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run validate --built --module changed
      - name: Upload requested build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modular-browser-bundles
          path: dist/**/*
          if-no-files-found: ignore
