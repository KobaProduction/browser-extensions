name: Publish ChatGPT Booster 0.8.98 stable

on:
  workflow_dispatch:
    inputs:
      approve_release:
        description: Publish the exact historical stable build without advancing product update channels
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && inputs.approve_release == true }}
    runs-on: zoomies-linux-x64
    concurrency:
      group: chatgpt-stable-v0-8-98
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reference/chatgpt-legacy-recovery-v0.8.98
          fetch-depth: 1
      - name: Verify original source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7c629ae3b3de22333ef6af436ded5be4391b58ba"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original code, test and build userscript/MV3
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run check
          bun run test
          CHATGPT_BOOSTER_BUILD_SHA=7c629ae3b3de22333ef6af436ded5be4391b58ba \
            CHATGPT_BOOSTER_BUILD_VERSION=0.8.98 \
            CHATGPT_BOOSTER_ROLLING=1 bun run build
      - name: Prepare original stable userscript identity and pinned updates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          tag = 'chatgpt-booster/v0.8.98'
          source = '7c629ae3b3de22333ef6af436ded5be4391b58ba'
          script = Path('packages/userscript/dist/chatgpt-booster.user.js')
          text = script.read_text(encoding='utf8')
          old = 'https://github.com/KobaProduction/chatgpt-booster/releases/latest/download/chatgpt-booster.user.js'
          url = 'https://github.com/KobaProduction/browser-extensions/releases/download/chatgpt-booster%2Fv0.8.98/chatgpt-booster.user.js'
          assert text.count(old) == 2, 'Unexpected stable update metadata'
          assert text.count('// @version      0.8.0') == 1
          assert text.count('// @namespace    https://github.com/KobaProduction/chatgpt-booster') == 1
          text = text.replace(old, url).replace('// @version      0.8.0', '// @version      0.8.98', 1)
          header = text.split('// ==/UserScript==', 1)[0]
          assert '// @name         ChatGPT Booster\n' in header
          assert '// @namespace    https://github.com/KobaProduction/chatgpt-booster' in header
          assert '// @booster-build 0.8.98' in header
          assert '// @version      0.8.98' in header
          assert header.count(url) == 2 and 'ChatGPT Booster Dev' not in header
          script.write_text(text, encoding='utf8')

          manifest = json.loads(Path('packages/extension/dist/manifest.json').read_text())
          assert manifest['version'] == '0.8.98'
          assert manifest['version_name'] == '0.8.98'

          Path('chatgpt-booster-build.json').write_text(json.dumps({
              'product': 'ChatGPT Booster',
              'version': '0.8.98',
              'sourceSha': source,
              'releaseTag': tag,
              'stable': True,
              'prerelease': False,
              'normalDevProdChannelsChanged': False,
              'browserAcceptance': 'source/build verified; installed profile still unverified',
              'userscriptSha256': hashlib.sha256(script.read_bytes()).hexdigest(),
          }, indent=2) + '\n')
          PY
          cd packages/extension/dist
          zip -qr "$GITHUB_WORKSPACE/chatgpt-booster-extension.zip" .
      - name: Publish ordinary stable release, not global Latest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='chatgpt-booster/v0.8.98'
          test "$(git rev-parse HEAD)" = '7c629ae3b3de22333ef6af436ded5be4391b58ba'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Stable ChatGPT 0.8.98 release already exists; refusing overwrite' >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Stable ChatGPT Booster v0.8.98, built from the original ChatGPT Booster source at SHA 7c629ae3b3de22333ef6af436ded5be4391b58ba.

          Original Tampermonkey identity and normal stable filename are preserved. Its two update URLs are pinned to this exact stable release tag; it will not automatically jump to the newer independent 2.x product line.

          Files: chatgpt-booster.user.js, chatgpt-booster-extension.zip and source/build metadata.
          This release does not advance the regular 2.x DEV/PROD/distribution channels.

          Existing browser profile and v3/v4 IndexedDB must be preserved before installing an older version. Do not enable multiple ChatGPT Booster copies on the same page. Successful source and build tests do not confirm live current-client acceptance.
          NOTES
          gh release create "$tag" \
            packages/userscript/dist/chatgpt-booster.user.js \
            chatgpt-booster-extension.zip \
            chatgpt-booster-build.json \
            --verify-tag \
            --title 'ChatGPT Booster v0.8.98' \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest=false
