name: Independent module releases
on:
  workflow_dispatch:
    inputs:
      approve_release:
        description: 'Explicit approval to publish accepted module versions after installed-product checks'
        type: boolean
        required: true
        default: false
      release_scope:
        description: 'Which independently-versioned product changed (automatically include all-in-one)'
        type: choice
        required: true
        default: all
        options:
          - all
          - chatgpt-booster
          - vk-booster
          - all-in-one
          - shared
permissions:
  contents: write
jobs:
  release:
    # An integration merge is not an authorized public release. A human must
    # explicitly approve after installing and inspecting the new binaries.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approve_release == true }}
    runs-on: zoomies-linux-x64
    concurrency:
      group: browser-tools-distribution
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.4.2'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Publish only new module versions with relevant changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          while IFS='|' read -r id version tag; do
            test -n "$tag" || continue
            bun scripts/build.ts --module "$id"
            bun scripts/validate.ts --built --module "$id"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Already released: $tag"
              continue
            fi
            gh release create "$tag" "dist/$id/$id.user.js" "dist/$id/$id-extension.zip" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$id v$version" --generate-notes
            bash scripts/publish-channel.sh "$id"
          done < <(bun scripts/release-plan.ts --tsv --scope "$RELEASE_SCOPE")
