name: Independent module releases
on:
  workflow_dispatch:
    inputs:
      approve_release:
        description: 'Explicit approval to publish accepted module versions after installed-product checks'
        type: boolean
        required: true
        default: false
      repair_channel:
        description: 'Repair PROD channel if stable release tag already exists'
        type: boolean
        default: false
      release_scope:
        description: 'Which independently-versioned product changed (automatically include all-in-one)'
        type: choice
        required: true
        default: none
        options:
          - none
          - chatgpt-booster
          - vk-booster
          - all-in-one
          - shared
          - all
permissions:
  contents: write
  checks: read
jobs:
  release:
    # An integration merge is not an authorized public release. A human must
    # explicitly approve after installing and inspecting the new binaries.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approve_release == true && inputs.release_scope != 'none' }}
    runs-on: zoomies-linux-x64
    concurrency:
      group: browser-tools-distribution
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.4.2'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Require successful CI for this exact PROD source commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '[.check_runs[] | select(.name == "check" and .conclusion == "success")] | length')"
          test "$count" -gt 0 || { echo "PROD source commit lacks a successful CI check" >&2; exit 1; }
      - name: Publish only new module versions with relevant changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
          REPAIR_CHANNEL: ${{ inputs.repair_channel }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          args=(--tsv --scope "$RELEASE_SCOPE")
          if [[ "$REPAIR_CHANNEL" == true ]]; then args+=(--include-existing); fi
          while IFS='|' read -r id version tag; do
            test -n "$tag" || continue
            bun scripts/build.ts --module "$id" --channel=prod
            bun scripts/validate.ts --built --module "$id" --channel=prod
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              # A repaired PROD channel may ONLY re-publish byte-identical
              # immutable release assets. Never republish HEAD under an old tag.
              saved="$(mktemp -d)"
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$saved"
              cmp "dist/$id/$id.user.js" "$saved/$id.user.js"
              cmp "dist/$id/$id-extension.zip" "$saved/$id-extension.zip"
              rm -rf "$saved"
            else
              gh release create "$tag" "dist/$id/$id.user.js" "dist/$id/$id-extension.zip" \
                --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                --title "$id v$version" --generate-notes
            fi
            bash scripts/publish-channel.sh "$id" prod
          done < <(bun scripts/release-plan.ts "${args[@]}")
