name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Package extension
        run: |
          cd packages/extension/dist
          zip -r ../../../chatgpt-booster-extension.zip .

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}"             chatgpt-booster-extension.zip             packages/userscript/dist/chatgpt-booster.user.js             packages/userscript/dist/chatgpt-booster.dev.user.js             packages/userscript/dist/chatgpt-booster.dev.user.js.map             --generate-notes             --title "${GITHUB_REF_NAME}"
