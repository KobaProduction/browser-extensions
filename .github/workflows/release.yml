name: Independent module releases
on:
  workflow_run:
    workflows: ['Validate modules (Zoomies)']
    types: [completed]
permissions:
  contents: write
jobs:
  release:
    # Publish only a successful CI of our own main-branch push. No untrusted PR code.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: zoomies-linux-x64
    concurrency:
      group: browser-tools-distribution
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.4.2'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Publish only new module versions with relevant changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          while IFS='|' read -r id version tag; do
            test -n "$tag" || continue
            bun scripts/build.ts --module "$id"
            bun scripts/validate.ts --built --module "$id"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Already released: $tag"
              continue
            fi
            gh release create "$tag" "dist/$id/$id.user.js" "dist/$id/$id-extension.zip" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$id v$version" --generate-notes
            bash scripts/publish-channel.sh "$id"
          done < <(bun scripts/release-plan.ts --tsv)
