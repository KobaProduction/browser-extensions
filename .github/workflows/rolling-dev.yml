name: Rolling Dev

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: rolling-dev
  cancel-in-progress: true

env:
  CHATGPT_BOOSTER_BUILD_SHA: ${{ github.sha }}
  CHATGPT_BOOSTER_BUILD_NUMBER: ${{ github.run_number }}
  CHATGPT_BOOSTER_ROLLING: '1'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build rolling artifacts
        run: bun run build

      - name: Package extension
        run: |
          cd packages/extension/dist
          zip -r ../../../chatgpt-booster-dev-extension.zip .

      - name: Write build metadata
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          BASE_VERSION="$(node -p "require('./package.json').version")"
          cat > chatgpt-booster-dev-build.json <<JSON
          {
            "baseVersion": "${BASE_VERSION}",
            "build": "${BASE_VERSION}-g${SHORT_SHA}",
            "sha": "${GITHUB_SHA}",
            "runNumber": "${GITHUB_RUN_NUMBER}",
            "ref": "${GITHUB_REF_NAME}",
            "createdAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

      - name: Publish rolling dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          BASE_VERSION="$(node -p "require('./package.json').version")"
          BUILD_LABEL="${BASE_VERSION}-g${SHORT_SHA}"
          git tag -f dev-latest "${GITHUB_SHA}"
          git push -f origin refs/tags/dev-latest
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release edit dev-latest \
              --prerelease \
              --title "Rolling Dev · ${BUILD_LABEL}" \
              --notes "Automated rolling build from dev at ${GITHUB_SHA}."
          else
            gh release create dev-latest \
              --target "${GITHUB_SHA}" \
              --prerelease \
              --title "Rolling Dev · ${BUILD_LABEL}" \
              --notes "Automated rolling build from dev at ${GITHUB_SHA}."
          fi
          gh release upload dev-latest \
            chatgpt-booster-dev-extension.zip \
            chatgpt-booster-dev-build.json \
            packages/userscript/dist/chatgpt-booster.dev.user.js \
            packages/userscript/dist/chatgpt-booster.dev.user.js.map \
            --clobber
