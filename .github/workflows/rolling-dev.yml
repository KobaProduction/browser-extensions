name: Rolling Dev

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: rolling-dev
  cancel-in-progress: true

env:
  CHATGPT_BOOSTER_BUILD_SHA: ${{ github.sha }}
  CHATGPT_BOOSTER_ROLLING: '1'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Resolve rolling version
        run: |
          SERIES="$(bun -e "console.log(require('./version-series.json').series)")"
          BASE_COMMIT="$(bun -e "console.log(require('./version-series.json').baseCommit)")"
          PATCH_VERSION="$(git rev-list --count "${BASE_COMMIT}..HEAD")"
          BUILD_VERSION="${SERIES}.${PATCH_VERSION}"
          echo "CHATGPT_BOOSTER_BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "BOOSTER_BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build rolling artifacts
        run: bun run build

      - name: Package extension
        run: |
          cd packages/extension/dist
          zip -r ../../../chatgpt-booster-dev-extension.zip .

      - name: Write build metadata
        run: |
          cat > chatgpt-booster-dev-build.json <<JSON
          {
            "baseVersion": "0.8",
            "version": "${BOOSTER_BUILD_VERSION}",
            "build": "${BOOSTER_BUILD_VERSION}",
            "sha": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF_NAME}",
            "createdAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

      - name: Publish rolling dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_LABEL="${BOOSTER_BUILD_VERSION}"
          git tag -f dev-latest "${GITHUB_SHA}"
          git push -f origin refs/tags/dev-latest
          if gh release view dev-latest >/dev/null 2>&1; then
            gh release edit dev-latest \
              --prerelease \
              --title "Rolling Dev · ${BUILD_LABEL}" \
              --notes "Automated rolling build from dev at ${GITHUB_SHA}."
          else
            gh release create dev-latest \
              --target "${GITHUB_SHA}" \
              --prerelease \
              --title "Rolling Dev · ${BUILD_LABEL}" \
              --notes "Automated rolling build from dev at ${GITHUB_SHA}."
          fi
          gh release upload dev-latest \
            chatgpt-booster-dev-extension.zip \
            chatgpt-booster-dev-build.json \
            packages/userscript/dist/chatgpt-booster.dev.user.js \
            packages/userscript/dist/chatgpt-booster.dev.user.js.map \
            --clobber
