name: Publish historical ChatGPT recovery

on:
  workflow_dispatch:
    inputs:
      checkpoint:
        type: choice
        description: Explicit original source checkpoint
        required: true
        options:
          - '0.8.98'
          - '0.8.92'
      approve_recovery:
        type: boolean
        description: Publish recovery-only prerelease, never PROD
        required: true
        default: false

permissions:
  contents: write

jobs:
  recovery:
    if: ${{ github.ref == 'refs/heads/main' && inputs.approve_recovery == true }}
    runs-on: zoomies-linux-x64
    concurrency:
      group: chatgpt-historical-recovery-release
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkpoint == '0.8.98' && 'reference/chatgpt-legacy-recovery-v0.8.98' || 'reference/chatgpt-legacy-rollback-v0.8.92' }}
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned historical commit
        env:
          VERSION: ${{ inputs.checkpoint }}
        shell: bash
        run: |
          set -euo pipefail
          case "$VERSION" in
            0.8.98) expected=7c629ae3b3de22333ef6af436ded5be4391b58ba ;;
            0.8.92) expected=6a4b00b99eb95f5f4090a2c780c511da4f28353a ;;
            *) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$expected"
          echo "RECOVERY_SOURCE_SHA=$expected" >> "$GITHUB_ENV"
          echo "RECOVERY_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Original source checks and reproducible builds
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run check
          bun run test
          CHATGPT_BOOSTER_BUILD_VERSION="$RECOVERY_VERSION" CHATGPT_BOOSTER_BUILD_SHA="$RECOVERY_SOURCE_SHA" CHATGPT_BOOSTER_ROLLING=1 bun run build
      - name: Pin updater, verify MV3 manifest and package binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          ver = os.environ['RECOVERY_VERSION']
          sha = os.environ['RECOVERY_SOURCE_SHA']
          tag = f'chatgpt-booster-recovery-v{ver}'
          p = Path('packages/userscript/dist/chatgpt-booster.dev.user.js')
          script = p.read_text()
          old = 'https://github.com/KobaProduction/chatgpt-booster/releases/download/dev-latest/chatgpt-booster.dev.user.js'
          new = f'https://github.com/KobaProduction/browser-extensions/releases/download/{tag}/chatgpt-booster.dev.user.js'
          assert script.count(old) == 2
          script = script.replace(old, new)
          header = script.split('// ==/UserScript==',1)[0]
          assert f'// @version      {ver}' in header
          assert f'// @booster-build {ver}' in header
          assert 'KobaProduction/chatgpt-booster/releases' not in header
          assert '@name         ChatGPT Booster Dev' in header
          p.write_text(script)
          mv3 = json.loads(Path('packages/extension/dist/manifest.json').read_text())
          assert mv3['version'] == ver and mv3['version_name'] == ver
          Path('chatgpt-booster-recovery-build.json').write_text(json.dumps({
              'purpose':'historical-recovery-only',
              'version':ver,
              'originalSourceSha':sha,
              'releaseTag':tag,
              'automaticProdPromotion':False,
              'installedBrowserParity':'not proven for rebuilt checkpoint',
              'requiresProfileBackupBeforeInstallation':True
          }, indent=2)+'\n')
          PY
          cd packages/extension/dist
          zip -qr "$GITHUB_WORKSPACE/chatgpt-booster-recovery-$RECOVERY_VERSION-extension.zip" .
      - name: Publish immutable pinned recovery prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="chatgpt-booster-recovery-v$RECOVERY_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Recovery release tag exists: refusing overwrite" >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/recovery-notes.md" <<EOF
          Historical ChatGPT Booster $RECOVERY_VERSION recovered from original SHA $RECOVERY_SOURCE_SHA.

          Manual recovery-only prerelease; not a new PROD version.
          0.8.98 contains the last old archive migration and owner-inspection widget.
          0.8.92 is the older v3 rollback.
          Back up the browser profile first, disable newer Booster and duplicates,
          and never delete existing v3/v4 browser storage to switch versions.
          Both userscript update URLs are pinned to this immutable release.
          Runtime parity on today's ChatGPT is not guaranteed by source checks.
          EOF
          gh release create "$tag" \
            packages/userscript/dist/chatgpt-booster.dev.user.js \
            "chatgpt-booster-recovery-$RECOVERY_VERSION-extension.zip" \
            chatgpt-booster-recovery-build.json \
            --target "$RECOVERY_SOURCE_SHA" \
            --title "ChatGPT Booster $RECOVERY_VERSION - historical recovery" \
            --notes-file "$RUNNER_TEMP/recovery-notes.md" \
            --prerelease --latest=false
