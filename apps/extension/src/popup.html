<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koba Browser Tools</title>
  <style>
    :root{color-scheme:light;--paper:#fff;--ink:#182337;--sub:#54627a;--line:#e1e6f0;--blue:#315aa7}
    *{box-sizing:border-box}
    body{width:330px;margin:0;background:var(--paper);color:var(--ink);font:13px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    header{display:flex;align-items:center;gap:11px;padding:20px;border-bottom:1px solid var(--line);background:linear-gradient(110deg,#fff 65%,#f6f8fc)}
    header svg{width:39px;height:39px}
    .eyebrow{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--blue);font-weight:800}
    h1{font-size:17px;line-height:1.3;margin:2px 0 0;font-weight:730;letter-spacing:-.02em}
    main{padding:20px}
    .label{font-weight:720;font-size:13px;margin-bottom:6px}
    p{color:var(--sub);font-size:12px;line-height:1.5;margin:0 0 16px}
    button{width:100%;border:0;border-radius:10px;padding:11px;background:var(--blue);color:#fff;font:650 13px system-ui;cursor:pointer}
    button:hover{background:#264b91}
    button:focus-visible{outline:3px solid #82a9f3;outline-offset:2px}
    footer{padding:12px 20px;border-top:1px solid var(--line);color:var(--sub);background:#f6f8fc;font-size:11px}
    @media(prefers-color-scheme:dark){
      :root{color-scheme:dark;--paper:#1d2736;--ink:#edf2fb;--sub:#abb9d0;--line:#3a4a62;--blue:#92b5f7}
      header{background:linear-gradient(110deg,#1d2736 65%,#253246)}
      button{background:#577ece;color:#fff}
      footer{background:#253246}
    }
  </style>
</head>
<body>
  <header>
    <svg viewBox="0 0 44 44" fill="none" aria-hidden="true">
      <rect x="1" y="1" width="42" height="42" rx="12" fill="#315AA7"/>
      <path d="M13 13v18m18-18L18.8 25.2M24 13l-11 11 11 7" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="31" cy="13" r="2.8" fill="#B9DBFF"/>
    </svg>
    <div><div class="eyebrow">Koba tools</div><h1>Browser Tools</h1></div>
  </header>
  <main>
    <div class="label">Инструменты текущего сайта</div>
    <p>Откройте единую панель для управления доступными модулями.</p>
    <button type="button" id="open">Открыть центр управления</button>
    <p id="status" role="status" aria-live="polite" style="margin:12px 0 0">Готов к работе</p>
  </main>
  <footer>Независимые модули · единый интерфейс</footer>
  <script src="popup.js" type="module"></script>
</body>
</html>
